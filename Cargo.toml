[package]
name = "oxidized"
version = "0.1.0"
edition = "2024"

# The generated code depends on lalrpop-util.
[dependencies]
color-print = { version = "0.3.7", features = ["terminfo"] }
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
similar-asserts = "2.0.0"
thiserror = "2.0.18"


# Add a build-time dependency on the lalrpop library:
[build-dependencies]
lalrpop = "0.22.2"

[dev-dependencies]
insta = { version = "1.47.2", features = ["filters"] }
# If you are supplying your own external lexer you can disable default features so that the
# built-in lexer feature is not included
# [dependencies]
# lalrpop-util = { version = "0.22.2", default-features = false }
#
# [build-dependencies]
# lalrpop = { version = "0.22.2", default-features = false }
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
